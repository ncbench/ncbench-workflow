name: benchmark

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
  workflow_dispatch:

# pull_request_target carries no `pull_request` payload, so
# github.event.pull_request.head.sha is empty on push/workflow_dispatch.
env:
  WORKFLOW_REF: ${{ github.event.pull_request.head.sha || github.sha }}

# One concurrency group per event: pull_request and pull_request_target both
# fire on the same push to a branch and share github.head_ref, so a single
# group made them cancel each other and the matrix never ran.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # 1. SETUP: Dynamically find the samples
  setup:
    # The workflow definition comes from main on pull_request_target, so a PR
    # that predates pull_request (e.g. #72) would run this stale copy twice and
    # cancel itself. pull_request is the copy that can be tested, so only it
    # and push/dispatch run here.
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      samples: ${{ steps.set-matrix.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKFLOW_REF }}

      - id: set-matrix
        run: |
          # Auto-discover benchmarks from resources/regions/, but only keep
          # those that include a test regions BED (required by the workflow).
          SAMPLES=$(for d in resources/regions/*/; do [ -f "$d/test-regions.cov-lc_high.bed" ] && basename "$d"; done | jq -R -s -c 'split("\n")[:-1]')
          echo "samples=$SAMPLES" >> $GITHUB_OUTPUT

  # 2. EVALUATE: The matrix-based analysis
  evaluate:
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: snakemake-workflow
      deployment: false
    env:
      SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN: ${{ secrets.SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN }}
    permissions:
      statuses: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.setup.outputs.samples) }}

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKFLOW_REF }}

      - name: Download reference genome
        uses: snakemake/snakemake-github-action@v2.1.2
        with:
          stagein: |
            conda install -y --name snakemake snakemake-storage-plugin-zenodo snakemake-storage-plugin-http
          directory: "."
          snakefile: "workflow/Snakefile"
          args: "--cores 1 --sdm conda --conda-cleanup-pkgs cache resources/reference/genome.fasta"

      - name: Download truthsets
        uses: snakemake/snakemake-github-action@v2.1.2
        with:
          stagein: |
            conda install -y --name snakemake snakemake-storage-plugin-zenodo snakemake-storage-plugin-http
          directory: "."
          snakefile: "workflow/Snakefile"
          args: "--sdm conda --cores 1 --conda-cleanup-pkgs cache --until benchmark_get_truth --config benchmark=${{ matrix.sample }}"

      - name: Fix modification dates
        uses: snakemake/snakemake-github-action@v2.1.2
        with:
          stagein: |
            conda install -y --name snakemake snakemake-storage-plugin-zenodo snakemake-storage-plugin-http
          directory: "."
          snakefile: "workflow/Snakefile"
          # Only touch the files for THIS matrix sample
          args: "--cores 1 --sdm conda --touch resources/regions/${{ matrix.sample }}/test-regions.cov-*.bed"

      - name: Run analysis
        uses: snakemake/snakemake-github-action@v2.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          # Storage plugins come from bioconda, so no pip is involved. The
          # logger plugin has no bioconda/conda-forge build, so pip install it
          # with the env's own python -- the snakemake env ships no pip binary,
          # so a bare `pip` resolves to the system python 3.12 instead.
          stagein: |
            conda install -y --name snakemake snakemake-storage-plugin-zenodo snakemake-storage-plugin-http
            conda install -y --name snakemake pip
            python -m pip install snakemake-logger-plugin-github-status
          args: >
            benchmark_all
            --config benchmark=${{ matrix.sample }}
            --cores 4 --sdm conda --conda-cleanup-pkgs cache
            --rerun-triggers mtime --all-temp --verbose
            --logger github-status --logger-github-status-run-name ${{ matrix.sample }}

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.sample }}
          # Upload the workflow outputs (keeps the on-disk paths Snakemake expects).
          path: results/
          retention-days: 1

  # 3. REPORT: Combine and Deploy
  report:
    needs: evaluate
    runs-on: ubuntu-latest
    environment:
      name: snakemake-workflow
      deployment: false
    env:
      SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN: ${{ secrets.SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKFLOW_REF }}

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          # Merge all benchmark artifacts back into the workspace so Snakemake sees `results/`.
          path: results/
          merge-multiple: true
      
      - run: tree -L 6

      - name: Create report
        uses: snakemake/snakemake-github-action@v2.1.2
        with:
          stagein: |
            conda install -y --name snakemake snakemake-storage-plugin-zenodo snakemake-storage-plugin-http
          directory: "."
          snakefile: "workflow/Snakefile"
          args: "--report report.zip"

      - name: Upload final report
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: report.zip

      - name: Trigger homepage build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy-page
          repo: ncbench/ncbench.github.io
          token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
