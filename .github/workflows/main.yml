name: benchmark

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel concurrent flows
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Full job: Run full benchmark suite in parallel
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        benchmark:
          - giab-NA12878-agilent-75M
          - giab-NA12878-agilent-200M
          - giab-NA12878-twist
          - chm-eval
    permissions:
      actions: write
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      BENCHMARK_GIAB_NA12878_AGILENT_TOKEN: ${{ secrets.BENCHMARK_GIAB_NA12878_AGILENT_TOKEN }}
      BO_AGILENT_TOKEN: ${{ secrets.BO_AGILENT_TOKEN }}
      CO_AGILENT_TOKEN: ${{ secrets.CO_AGILENT_TOKEN }}
      BO_CORE_UNIT_TOKEN: ${{ secrets.BO_CORE_UNIT_TOKEN }}
      BENCHMARK_GIAB_NA12878_TWIST_TOKEN: ${{ secrets.BENCHMARK_GIAB_NA12878_TWIST_TOKEN }}
      SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN: ${{ secrets.SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN }}
      TMPDIR: /mnt/tmp
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Prepare /mnt workspace
        run: |
          sudo mkdir -p /mnt/conda /mnt/tmp
          sudo chown -R $USER:$USER /mnt/conda /mnt/tmp

      - name: Restore caches (conda + snakemake)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/miniconda3/pkgs
            /home/runner/miniconda3/envs/snakemake
            /home/runner/.cache/pip
            /home/runner/.cache/snakemake
            /mnt/conda
          key: ${{ runner.os }}-conda-v2-${{ hashFiles('workflow/Snakefile', 'workflow/rules/**/*.smk', 'config/config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-conda-v2-

      # This step is necessary (after downloading the truthsets above) to ensure
      # that the files coming from the git repo are not triggering reruns
      # because their modification dates are too new or too old.
      # (as git does not preserve modification dates)
      - name: Fix modification dates
        run: touch resources/regions/*/test-regions.cov-*.bed

      - name: Debug - List results directory before run
        run: |
          echo "=== Contents of results/ before run ==="
          ls -la results/ 2>/dev/null || echo "results/ does not exist"
          echo "=== Contents of .snakemake/ before run ==="
          ls -la .snakemake/ 2>/dev/null || echo ".snakemake/ does not exist"

      - name: Setup Snakemake environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          activate-environment: snakemake
          python-version: "3.12"

      - name: Install Snakemake and plugins
        shell: bash -l {0}
        run: |
          conda install -n snakemake -c conda-forge -c bioconda snakemake -y
          pip install snakemake-storage-plugin-zenodo snakemake-storage-plugin-http
          snakemake --version

      - name: Debug - Dry-run Snakemake
        shell: bash -l {0}
        run: |
          echo "=== Dry-run to show what jobs would run ==="
          snakemake --directory . --snakefile workflow/Snakefile benchmark_all \
            --cores 2 --sdm conda --conda-prefix /mnt/conda \
            --config benchmark=${{ matrix.benchmark }} \
            --dry-run -p 2>&1 || echo "Dry-run exit code: $?"

      - name: Run Snakemake directly
        shell: bash -l {0}
        run: |
          set -x
          echo "=== Starting Snakemake run ==="
          snakemake --directory . --snakefile workflow/Snakefile benchmark_all \
            --cores 2 --sdm conda --conda-prefix /mnt/conda \
            --conda-cleanup-pkgs cache --conda-cleanup-envs \
            --retries 3 --resources downloads=1 \
            --config benchmark=${{ matrix.benchmark }} \
            --forceall --printshellcmds --verbose \
            2>&1 || {
              EXIT_CODE=$?
              echo "=== Snakemake failed with exit code: $EXIT_CODE ==="
              echo "=== Checking .snakemake/log/ ==="
              ls -la .snakemake/log/ 2>/dev/null || echo "No log directory"
              cat .snakemake/log/*.log 2>/dev/null | tail -100 || echo "No logs found"
              exit $EXIT_CODE
            }
          echo "=== Snakemake completed successfully ==="

      - name: Debug - List results directory after run
        if: always()
        run: |
          echo "=== Contents of results/ after run ==="
          ls -la results/ 2>/dev/null || echo "results/ does not exist"
          find results/ -type f 2>/dev/null | head -50 || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.benchmark }}
          path: results/
          retention-days: 1

  # Final job: Combine results and create report
  report:
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN: ${{ secrets.SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: 8BitJonny/gh-get-current-pr@3.0.0
        id: pr
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          filterOutClosed: true

      - run: |
          echo "is PR: ${{ steps.pr.outputs.pr_found }}"
          echo "current branch: ${{ github.ref }}"

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Restore caches (conda)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/miniconda3/pkgs
            /home/runner/miniconda3/envs/snakemake
            /home/runner/.cache/pip
          key: ${{ runner.os }}-conda-v2-${{ hashFiles('workflow/Snakefile', 'workflow/rules/**/*.smk', 'config/config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-conda-v2-

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true

      - name: Setup Snakemake environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          activate-environment: snakemake
          python-version: "3.12"

      - name: Install Snakemake and plugins
        shell: bash -l {0}
        run: |
          conda install -n snakemake -c conda-forge -c bioconda snakemake -y
          pip install snakemake-storage-plugin-zenodo snakemake-storage-plugin-http

      - name: Create report
        shell: bash -l {0}
        run: |
          snakemake --directory . --snakefile workflow/Snakefile \
            --report report.zip benchmark_all

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.zip

      - name: Trigger homepage build
        if: ${{ (steps.pr.outputs.pr_found != 'true') && (github.ref == 'refs/heads/main') }}
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy-page
          repo: ncbench/ncbench.github.io
          token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
