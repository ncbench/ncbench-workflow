name: benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1. NEW JOB: Detect samples
  setup:
    runs-on: ubuntu-latest
    outputs:
      samples: ${{ steps.set-matrix.outputs.samples }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          # Option A: Get sample names from directory names
          # This looks into resources/regions/, filters out non-directories, and formats as JSON
          SAMPLES=$(ls -d resources/regions/*/ | xargs -n 1 basename | jq -R -s -c 'split("\n")[:-1]')
          
          # Option B: If your samples are defined in a Snakemake config.yaml
          # You could use: SAMPLES=$(python3 -c "import yaml; print(list(yaml.safe_load(open('config/config.yaml'))['samples'].keys()))" | jq -c .)
          
          echo "Detected samples: $SAMPLES"
          echo "samples=$SAMPLES" >> $GITHUB_OUTPUT

  # 2. EVALUATE JOB: Now uses the output from 'setup'
  evaluate:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This dynamically injects the list from the setup job
        sample: ${{ fromJson(needs.setup.outputs.samples) }}
    
    # ... rest of your evaluate job ...
    steps:
      - uses: actions/checkout@v4
      # ... (disk space, etc.)
      
      - name: Run analysis
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          args: >
            --cores 4 --sdm conda 
            results/benchmarks/${{ matrix.sample }}/results.zip
          # ... stagein ...

  # 3. REPORT JOB: Stays the same, but needs both setup and evaluate
  report:
    needs: [setup, evaluate]
    runs-on: ubuntu-latest
    # ... (same as previous response)