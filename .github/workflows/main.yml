name: benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1. SETUP: Detect samples dynamically
  setup:
    runs-on: ubuntu-latest
    outputs:
      samples: ${{ steps.set-matrix.outputs.samples }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          # Detect folder names in resources/regions/
          SAMPLES=$(ls -d resources/regions/*/ | xargs -n 1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo "samples=$SAMPLES" >> $GITHUB_OUTPUT

  # 2. EVALUATE: Parallel processing with Micromamba
  evaluate:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.setup.outputs.samples) }}
    
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      BENCHMARK_GIAB_NA12878_AGILENT_TOKEN: ${{ secrets.BENCHMARK_GIAB_NA12878_AGILENT_TOKEN }}
      BO_AGILENT_TOKEN: ${{ secrets.BO_AGILENT_TOKEN }}
      CO_AGILENT_TOKEN: ${{ secrets.CO_AGILENT_TOKEN }}
      BO_CORE_UNIT_TOKEN: ${{ secrets.BO_CORE_UNIT_TOKEN }}
      BENCHMARK_GIAB_NA12878_TWIST_TOKEN: ${{ secrets.BENCHMARK_GIAB_NA12878_TWIST_TOKEN }}
      SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN: ${{ secrets.SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Snakemake + Plugins
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: snakemake-env
          channels: conda-forge,bioconda
          create-args: >-
            python=3.11
            snakemake
            snakemake-storage-plugin-zenodo
            snakemake-storage-plugin-http
          cache-environment: true

      - name: Run Snakemake
        shell: bash -el {0}
        run: |
          snakemake \
            results/benchmarks/${{ matrix.sample }}/results.zip \
            --cores 4 \
            --sdm conda \
            --conda-cleanup-pkgs cache \
            --rerun-triggers mtime

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sample }}
          path: results/benchmarks/${{ matrix.sample }}/
          retention-days: 1

  # 3. REPORT: Combine results
  report:
    needs: [setup, evaluate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snakemake + Plugins
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: snakemake-env
          create-args: >-
            python=3.11
            snakemake
            snakemake-storage-plugin-zenodo
            snakemake-storage-plugin-http
          cache-environment: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: results/benchmarks/

      - name: Generate Report
        shell: bash -el {0}
        run: snakemake --report report.zip

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: report.zip

  # 4. DEPLOY: Trigger external update
  deploy:
    needs: report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homepage build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy-page
          repo: ncbench/ncbench.github.io
          token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}